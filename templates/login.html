<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>লগইন | Marriage Media</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Serif Bengali", "SolaimanLipi", serif;
            background: #faf8f2;
            color: #333;
            min-height: 100vh;
        }

        /* =========================
           HEADER
        ========================= */

        .navbar {
            height: 78px;
            background: #ffffff;
            border-bottom: 1px solid #e5d7b5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .logo {
            font-family: Georgia, serif;
            font-size: 28px;
            font-weight: bold;
            color: #b58a32;
            text-decoration: none;
        }

        .home-btn {
            text-decoration: none;
            color: #5b4a2f;
            font-size: 18px;
            padding: 10px 22px;
            border: 1px solid #d6b96c;
            border-radius: 25px;
            transition: 0.3s;
        }

        .home-btn:hover {
            background: #b58a32;
            color: white;
        }

        /* =========================
           LOGIN AREA
        ========================= */

        .login-section {
            min-height: calc(100vh - 78px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-box {
            width: 430px;
            background: #ffffff;
            padding: 45px 42px;
            border-radius: 18px;
            border: 1px solid #ead9ae;
            box-shadow: 0 12px 40px rgba(120, 90, 30, 0.12);
            text-align: center;
        }

        .login-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #f8efd9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
        }

        .login-box h1 {
            color: #a87b24;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 16px;
            margin-bottom: 30px;
        }

        /* =========================
           DJANGO MESSAGES
        ========================= */

        .messages {
            margin-bottom: 20px;
        }

        .message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .message.error {
            background: #fdeaea;
            color: #a12626;
            border: 1px solid #efb5b5;
        }

        .message.success {
            background: #eaf8ed;
            color: #237a36;
            border: 1px solid #b7dfbf;
        }

        .message.warning {
            background: #fff7df;
            color: #8a6918;
            border: 1px solid #ead28b;
        }

        /* =========================
           FORM
        ========================= */

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #57472d;
            font-size: 16px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #d9c89f;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
            background: #fffdf8;
        }

        .form-group input:focus {
            border-color: #b58a32;
            box-shadow: 0 0 0 3px rgba(181, 138, 50, 0.12);
        }

        /* =========================
           FORGOT PASSWORD
        ========================= */

        .forgot {
            display: block;
            text-align: right;
            margin-top: -10px;
            margin-bottom: 25px;
            color: #a87b24;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 30px;
            background: linear-gradient(135deg, #b58a32, #d5ad55);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(181, 138, 50, 0.25);
        }

        /* =========================
           SIGNUP
        ========================= */

        .signup-text {
            margin-top: 25px;
            color: #777;
            font-size: 15px;
        }

        .signup-text a {
            color: #a87b24;
            font-weight: bold;
            text-decoration: none;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        /* =========================
           DIVIDER
        ========================= */

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            color: #c8b98f;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: #e4d7b8;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .navbar {
                padding: 0 20px;
            }

            .logo {
                font-size: 22px;
            }

            .home-btn {
                font-size: 15px;
                padding: 8px 15px;
            }

            .login-box {
                width: 100%;
                padding: 35px 25px;
            }

            .login-box h1 {
                font-size: 27px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="navbar">

        <a href="{% url 'home' %}" class="logo">
            Marriage Media
        </a>

        <a href="{% url 'home' %}" class="home-btn">
            🏠 হোম
        </a>

    </header>


    <!-- =========================
         LOGIN SECTION
    ========================= -->

    <section class="login-section">

        <div class="login-box">


            <div class="login-icon">
                🔐
            </div>


            <h1>
                লগইন করুন
            </h1>


            <p class="subtitle">
                আপনার Marriage Media অ্যাকাউন্টে প্রবেশ করুন
            </p>


            <!-- =========================
                 DJANGO MESSAGES
            ========================= -->

            {% if messages %}

                <div class="messages">

                    {% for message in messages %}

                        <div class="message {{ message.tags }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                </div>

            {% endif %}


            <!-- =========================
                 LOGIN FORM
            ========================= -->

            <form method="post">

                {% csrf_token %}


                <!-- EMAIL / MOBILE -->

                <div class="form-group">

                    <label for="email">
                        ইমেইল / মোবাইল নম্বর
                    </label>


                    <!--
                        গুরুত্বপূর্ণ:
                        name="email"

                        কারণ views.py-তে আছে:
                        request.POST.get("email", "")
                    -->

                    <input
                        type="text"
                        id="email"
                        name="email"
                        placeholder="আপনার ইমেইল বা মোবাইল নম্বর"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        পাসওয়ার্ড
                    </label>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="আপনার পাসওয়ার্ড"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- FORGOT PASSWORD -->

                <a href="#" class="forgot">
                    পাসওয়ার্ড ভুলে গেছেন?
                </a>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                >
                    🔐 লগইন করুন
                </button>


            </form>


            <!-- DIVIDER -->

            <div class="divider">
                অথবা
            </div>


            <!-- SIGNUP -->

            <p class="signup-text">

                এখনো অ্যাকাউন্ট নেই?

                <a href="{% url 'signup' %}">
                    বিনামূল্যে রেজিস্ট্রেশন করুন
                </a>

            </p>


        </div>

    </section>


</body>

</html>
